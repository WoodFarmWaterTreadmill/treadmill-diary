<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shelly's Appointments</title><style>body{margin:0;background:#f6f7f5;color:#243028;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:28px 16px 50px}header,section{background:#fff;border:1px solid #e1e6e1;border-radius:18px;padding:20px;margin-bottom:14px}.day{font-weight:700;font-size:18px;margin-bottom:8px}.row{display:grid;grid-template-columns:90px 1fr 1fr;gap:12px;border-top:1px solid #edf0ed;padding:12px 0}.time{font-weight:700}.label{font-size:11px;color:#788078;text-transform:uppercase;letter-spacing:.05em}.value{font-size:16px}</style></head><body><main><header><h1>Shelly's Appointments</h1></header><div id="app">Loading...</div></main><script>fetch('../appointments.json?v='+Date.now()).then(r=>r.json()).then(data=>{const now=new Date();const items=data.appointments.filter(a=>new Date(a.date+'T'+a.time+':00')>=now);const groups={};items.forEach(a=>(groups[a.date]??=[]).push(a));const fmt=d=>{const [y,m,day]=d.split('-');return new Date(y,m-1,day).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});};document.getElementById('app').innerHTML=items.length?Object.entries(groups).map(([d,arr])=>`<section><div class="day">${fmt(d)}</div>${arr.map(a=>`<div class="row"><div class="time">${a.time}</div><div><div class="label">Horse</div><div class="value">${a.horse}</div></div><div><div class="label">Owner</div><div class="value">${a.owner}</div></div></div>`).join('')}</section>`).join(''):'<section>No upcoming booked appointments.</section>';}).catch(()=>document.getElementById('app').textContent='Unable to load appointments.');</script></body></html>
