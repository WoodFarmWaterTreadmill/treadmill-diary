<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelly's Appointments</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202a;background:#f5f6f8}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:0 auto;padding:24px 16px 40px}
header{background:white;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 2px 12px #0000000b}
h1{margin:0 0 5px;font-size:28px}#summary{color:#68717d;font-size:14px}
.card{background:white;border-radius:16px;margin:10px 0;padding:16px;box-shadow:0 2px 12px #0000000b}
.date{font-weight:700;font-size:18px;margin-bottom:10px}.row{display:grid;grid-template-columns:72px 1fr 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #eceef1}
.time{font-weight:700}.label{font-size:11px;color:#7a828c;text-transform:uppercase;letter-spacing:.05em}.value{font-size:15px}
.empty{background:white;border-radius:16px;padding:24px;text-align:center;color:#68717d}.error{color:#a33}
@media(max-width:650px){.row{grid-template-columns:64px 1fr}.owner{grid-column:2}}
</style>
</head>
<body><div class="wrap"><header><h1>Shelly's Appointments</h1><div id="summary">Loading…</div></header><main id="appointments"></main></div>
<script>
const fmtDate=iso=>new Intl.DateTimeFormat('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}).format(new Date(iso+'T12:00:00'));
fetch('../appointments.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{
 const current=new Date();
 const upcoming=data.appointments.filter(a=>new Date(a.date+'T'+a.time+':00')>=current);
 const groups={}; upcoming.forEach(a=>(groups[a.date]??=[]).push(a));
 document.getElementById('summary').textContent=upcoming.length+(upcoming.length===1?' appointment':' appointments')+' coming up';
 const main=document.getElementById('appointments');
 if(!upcoming.length){main.innerHTML='<div class="empty">No upcoming appointments.</div>';return;}
 main.innerHTML=Object.entries(groups).map(([date,items])=>`<section class="card"><div class="date">${fmtDate(date)}</div>${items.map(a=>`<div class="row"><div class="time">${a.time}</div><div><div class="label">Horse</div><div class="value">${a.horse}</div></div><div class="owner"><div class="label">Owner</div><div class="value">${a.owner}</div></div></div>`).join('')}</section>`).join('');
}).catch(()=>{document.getElementById('summary').textContent='';document.getElementById('appointments').innerHTML='<div class="empty error">Unable to load appointments.</div>';});
</script></body></html>
